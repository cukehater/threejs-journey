<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll base animation</title>
    <link rel="stylesheet" href="../../reset.css" />
    <style>
      body {
        background-color: #333;
      }
      .section {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 2rem;
        width: 100%;
        text-align: center;
      }
      h1,
      h2,
      h3 {
        font-size: 60px;
        color: #ffeded;
        font-weight: 700;
        text-transform: uppercase;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas class="webgl"></canvas>

    <section class="section">
      <h1>My Portfolio</h1>
    </section>
    <section class="section">
      <h2>My projects</h2>
    </section>
    <section class="section">
      <h3>Contact me</h3>
    </section>

    <script type="module" src="./script.js"></script>
  </body>
</html>
